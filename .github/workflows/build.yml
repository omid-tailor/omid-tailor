
name: OMID TAILOR Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q omid_tailor_android_github_v2.zip -d extracted
          PACKAGE_JSON=$(find extracted -type f -name package.json -print -quit)
          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found inside ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          cp -a "$PROJECT_DIR"/. "$GITHUB_WORKSPACE"/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: OMID-TAILOR-APK
          path: android/app/build/outputs/apk/debug/*.apk
